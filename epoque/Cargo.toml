[package]
name = "epoque-shortcut"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Command lines of the runner, the broadcast benchmark and the experiments.
clap = { version = "4.6.7", features = ["derive"] }
# Arithmetic modulo q (RustCrypto): reductions, modular add/sub/neg/mul, inverses.
crypto-bigint = { version = "0.7.10", default-features = false }
rand = { version = "0.10.3", features = ["unbiased"] }
rand_core = "0.10.1"
# The thread pool of the parallel products and samplers (as in basic and RBE).
rayon = "1.11.0"
# GMP and MPFR: primality, arbitrary integers and the certified samplers.
rug = { version = "1.30.0", default-features = false, features = ["integer", "rational", "float", "std"] }
serde_json = "1.0"
# Inverse normal CDF, only as the starting point of the certified search.
statrs = { version = "0.19.1", default-features = false, features = ["std"] }

[dev-dependencies]
hex = "0.4.3"

